[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raven-m-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.17",
  "Pillow>=10",
  "requests>=2.31"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
