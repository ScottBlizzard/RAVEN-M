variant: M0
history_policy: raven_full
executor_calls_per_step: 1
conditional_roles:
  planner:
    trigger: first_transition_or_every_5_steps
    prompt: prompts/planner_v1.md
    schema: schemas/plan.v1.schema.json
  critic:
    trigger: loop_or_contradiction_or_completion
    prompt: prompts/critic_v1.md
    schema: schemas/critic.v1.schema.json
memory_config: configs/memory/raven_v1.yaml
action_schema: schemas/action.raven.v1.schema.json
context_cap_tokens: 8192
prompt: prompts/executor_raven_v1.md
scope: episode_only
